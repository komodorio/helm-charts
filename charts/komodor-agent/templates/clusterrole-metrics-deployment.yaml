{{- include "applyProfile" . -}}
{{- if and (.Values.createRbac) (.Values.capabilities.metrics) -}}
kind: ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: {{ include "komodorAgent.clusterRole.metricsDeployment" . }}
rules:
# Base read permissions for metrics collection (same as daemon-metrics)
- apiGroups:
  - ""
  resources:
  - configmaps
  - namespaces
  - pods
  - nodes
  - nodes/stats
  - nodes/proxy
  verbs:
  - get
  - list
- apiGroups:
  - extensions
  - networking.k8s.io
  resources:
  - ingresses
  verbs:
  - get
  - watch
  - list
# apiserver metrics access
- nonResourceURLs:
  - "/metrics"
  verbs:
  - get
- apiGroups:
  - apps
  resources:
  - deployments
  - replicasets
  - statefulsets
  - daemonsets
  verbs:
  - get
- apiGroups:
  - batch
  resources:
  - jobs
  - cronjobs
  verbs:
  - get
- apiGroups:
  - autoscaling
  resources:
  - horizontalpodautoscalers
  verbs:
  - get
  - list
- apiGroups:
  - ""
  resources:
  - pods
  verbs:
  - watch
# komodor_binpacking_state runs informers over the cluster's schedulable state, so it needs
# list+watch where the rules above grant only get. Same set clusterrole-admission-controller.yaml
# already grants, minus the writes.
- apiGroups:
  - ""
  resources:
  - nodes
  - persistentvolumes
  - persistentvolumeclaims
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - policy
  resources:
  - poddisruptionbudgets
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - apps
  resources:
  - deployments
  - replicasets
  - statefulsets
  - daemonsets
  verbs:
  - list
  - watch
- apiGroups:
  - batch
  resources:
  - jobs
  - cronjobs
  verbs:
  - list
  - watch
{{- end -}}
