imagePullSecret: docker-cfg-komodorio

capabilities:
  event:
    redact: "{.*KEY.*,.*key.*,.*BUGSNAG.*}"
  events:
    create: false
  kubectlProxy:
    enabled: true
  admissionController:
    enabled: true
    binpacking:
      enabled: true
      markUnevictable: true
      addNodeAffinityToMarkedPods: true
    mutatingWebhook:
      selfManage: true # do not create the mutating webhook configuration since we need to install the agent multiple times it will conflict
  impersonation:
    enabled: true

allowedResources:
  secret: true

components:
  komodorDaemonWindows:
    tolerations:
      - key: Windows
        operator: Exists
  komodorDaemon:
    tolerations:
      - key: "komodor.io/sensitive"
        operator: "Equal"
        value: "true"
        effect: "NoSchedule"
      - key: dedicated
        operator: "Equal"
        value: "ws-redis"
        effect: "NoSchedule"
      # The pod-placement-sim NodePool's toleration is added for one release per cluster only:
      # pod-placement-sim-daemon-values.yaml (see update_agent.sh).
    # Requests ~= 14-day p95 x 1.3 measured in `production` (the busiest cluster using this file);
    # limits stay at chart defaults. Chart default was 401m / 622Mi per pod -> now 151m / 504Mi.
    # Applies to every release update_agent.sh installs with this file. finops 2026-11-17 #7.
    metrics: # telegraf: 14d per-pod hourly cpu p95 99m (peak 318m), mem p95 263Mi (peak 397Mi)
      resources:
        requests:
          cpu: 130m
          memory: 350Mi
    metricsInit: # init container + telegraf-init-sidecar: p95 1m / 21Mi, max 3m / 28Mi
      resources:
        requests:
          cpu: 5m
          memory: 32Mi
    opentelemetry: # otel-collector: p95 4m / 60Mi, peak 49m / 77Mi
      resources:
        requests:
          cpu: 10m
          memory: 80Mi
      otelInit: # otel-init-sidecar: p95 1m / 22Mi, max 1m / 28Mi
        resources:
          requests:
            cpu: 5m
            memory: 32Mi
  komodorMetrics:
    tolerations:
      - key: "komodor.io/sensitive"
        operator: "Equal"
        value: "true"
        effect: "NoSchedule"
  komodorAgent:
    watcher:
      extraEnvVars:
        # DD_VERSION + DD_SERVICE is set in the agent already
        - name: "ENABLE_DD_PROFILER"
          value: "true"
        - name: "DD_ENV"
          value: "production"
        - name: "DD_AGENT_HOST"
          valueFrom:
            fieldRef:
              fieldPath: status.hostIP



